<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fretwise: guitar theory workbench</title>
    <meta name="description" content="Interactive circle of fifths, fretboard (scales, chords, triads, CAGED, alternate tunings) and modes explorer for guitarists." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233A2118'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23D9932B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 40 24" aria-hidden="true" class="brand-mark">
          <rect x="0" y="2" width="40" height="20" rx="3" />
          <line x1="12" y1="2" x2="12" y2="22" />
          <line x1="24" y1="2" x2="24" y2="22" />
          <line x1="35" y1="2" x2="35" y2="22" />
          <circle cx="18" cy="12" r="3.4" />
        </svg>
        <span>Fretwise</span>
      </div>
      <button id="pages-toggle" type="button" aria-expanded="false" aria-controls="views"></button>
      <nav id="views" aria-label="Pages"></nav>
      <button id="metro-toggle" type="button" class="sound" aria-expanded="false" aria-controls="metronome" aria-label="Metronome" title="Metronome">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 2h5.6l2.7 12H2.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /><path d="M8 11 11.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        <span>Metronome</span>
      </button>
      <button id="sound" type="button" class="sound" aria-pressed="true" aria-label="Sound" title="Sound on or off">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor" /><path class="wave" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
        <span>Sound on</span>
      </button>
    </header>
    <div id="session-bar" class="session-bar" hidden></div>
    <main id="main" tabindex="-1"></main>
    <aside id="metronome" class="metro-dock" hidden></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
